[package]
name = "incdb-cli"
version = "0.1.0"
edition = "2021"
authors = ["IncDB Contributors"]
license = "Apache-2.0"

[workspace]

[[bin]]
name = "incdb"
path = "src/main.rs"

[dependencies]
incdb-core = { path = "../incdb-core" }
incdb-storage = { path = "../incdb-storage" }
incdb-query = { path = "../incdb-query" }
incdb-api = { path = "../incdb-api", default-features = false }
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

