[package]
name = "incdb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "incdb"
path = "src/main.rs"

[dependencies]
incdb-core = { path = "../incdb-core" }
incdb-storage = { path = "../incdb-storage" }
incdb-query = { path = "../incdb-query" }
incdb-api = { path = "../incdb-api", default-features = false }
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
rand = "0.8"

