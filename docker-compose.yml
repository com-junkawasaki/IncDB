services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: incdb-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - INCDB_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: incdb-web
    ports:
      - "5173:3000"
    environment:
      - API_URL=http://api:8080
      - PORT=3000
      - HOST=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    working_dir: /app/build
    command: node index.js

volumes:
  data:
    driver: local

